name: Publish Morrice Softball (auto-update records PDF)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morrice-pages
  cancel-in-progress: false

jobs:
  build:
    name: Read PDF and build site
    runs-on: ubuntu-latest
    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2'

      - name: Prepare clean website copy
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/tools/' --exclude='/_site/' --exclude='/*.md' --exclude='/*.zip' --exclude='/*.py' --exclude='/README*' ./ _site/

      - name: Import newest record book into searchable archive
        run: |
          python tools/import_records.py \
            --pdf 'assets/Morrice_Softball_Records.pdf' \
            --reference 'data/records-data.js' \
            --output '_site/data/records-data.js' \
            --report '/tmp/record-import-summary.txt'
          cat /tmp/record-import-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
